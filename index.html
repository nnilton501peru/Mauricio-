<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Radio Mauricio Oficial</title>
</head>
<body>
    <h1>📻 RADIO MAURICIO</h1>
    <p>Selecciona tu radio:</p>
    <select id="emisora" onchange="cambiarRadio()">
        <option value="https://radios.perustream.com/8004/stream">Radio Moda</option>
        <option value="https://radios.perustream.com/8022/stream">La Karibeña</option>
        <option value="https://radios.perustream.com/8002/stream">Ritmo Romantica</option>
    </select>
    <br><br>
    <audio id="player" controls autoplay style="width:100%"></audio>
    <script>
        function cambiarRadio() {
            var player = document.getElementById('player');
            player.src = document.getElementById('emisora').value;
            player.play();
        }
        window.onload = cambiarRadio;
    </script>
</body>
</html>
